# OSV-Scanner configuration.
#
# Accepted, justified vulnerability exceptions. Each entry is a deliberate risk
# decision, not a silent suppression: low severity or no fix at all, no clean
# fix path, and no production exposure. Revisit on each dependency bump.
#
# Every other advisory against this lockfile is fixed by an in-range update
# (astro >= 7.2.8 et al.) or by the npm `overrides` in package.json
# (postcss-nested -> postcss-selector-parser ^7.1.6; katex ^0.18.2, which
# mermaid otherwise holds at ^0.16). This file must sit next to
# package-lock.json.
