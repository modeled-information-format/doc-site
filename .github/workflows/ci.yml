name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # SCA: OSV-Scanner + dependency-review, as a thin caller of the org central
  # reusable (consume, never reinvent).
  sca:
    permissions:
      actions: read
      contents: read
      security-events: write
      pull-requests: write
    uses: modeled-information-format/.github/.github/workflows/reusable-sca-osv.yml@f83ee8058630235396f7242580570b26cf3617fa
    with:
      fail-on-severity: high

  # SAST: CodeQL, as a thin caller of the org central reusable (consume,
  # never reinvent). No GitHub-native "default setup" was configured for this
  # repo; this workflow-based call is the org's standard instead.
  sast:
    permissions:
      security-events: write
      contents: read
      actions: read
      packages: read
    uses: modeled-information-format/.github/.github/workflows/reusable-sast-codeql.yml@f83ee8058630235396f7242580570b26cf3617fa
    with:
      languages: 'javascript-typescript,actions'

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: npm
      - name: Install
        run: npm ci
      - name: Build (validates the Starlight site + all internal links)
        run: npm run build

  # Auto-publish: after a green build on a push to main, tell the org Pages
  # site to rebuild and redeploy by firing the `source-updated`
  # repository_dispatch its deploy.yml waits for. Runs only on push (not on
  # PRs). Without this, doc-site changes merge to main but never reach the
  # live site until someone manually runs the .io repo's deploy
  # workflow_dispatch — the same dormant-hook gap research-harness-template
  # fixed for itself; see that repo's docs.yml for the identical pattern.
  notify-deploy:
    name: notify org Pages
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Mint a token scoped to the org Pages repo
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PAGES_CLIENT_APP_ID }}
          private-key: ${{ secrets.PAGES_CLIENT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: modeled-information-format.github.io
          # Down-scope the minted token: the repository_dispatch only needs contents:write.
          permission-contents: write

      - name: Trigger the org Pages redeploy
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository_owner }}/modeled-information-format.github.io/dispatches" \
            -f event_type=source-updated
